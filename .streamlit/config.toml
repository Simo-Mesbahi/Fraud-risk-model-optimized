# Dual native palettes. Appearance follows System until the viewer chooses Light or Dark.
[theme]
base = "light"
font = "sans-serif"
baseFontSize = 16
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#2458D3"
backgroundColor = "#F3F6FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15243B"
borderColor = "#B8C7DC"
dataframeBorderColor = "#D9E2EF"
dataframeHeaderBackgroundColor = "#EAF0F8"
dataframeHeaderTextColor = "#15243B"
linkColor = "#234FAF"
codeTextColor = "#243A5B"
codeBackgroundColor = "#EAF0F8"
redColor = "#BF2340"
orangeColor = "#B5470B"
yellowColor = "#895605"
greenColor = "#06734D"
blueColor = "#2458D3"
violetColor = "#6848C6"
grayColor = "#50617B"
chartCategoricalColors = ["#3977D5", "#B87812", "#238568", "#8B5CF6", "#D34E69", "#238CA1"]

[theme.light.sidebar]
backgroundColor = "#EAF0F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15243B"
borderColor = "#B8C7DC"

[theme.dark]
primaryColor = "#326FE5"
backgroundColor = "#080E1A"
secondaryBackgroundColor = "#111B2C"
textColor = "#EAF0F9"
borderColor = "#30415C"
dataframeBorderColor = "#30415C"
dataframeHeaderBackgroundColor = "#152034"
dataframeHeaderTextColor = "#EAF0F9"
linkColor = "#93BAFF"
codeTextColor = "#D5E4FB"
codeBackgroundColor = "#111B2C"
redColor = "#FF829A"
orangeColor = "#FFA679"
yellowColor = "#F1C364"
greenColor = "#61DFA7"
blueColor = "#659CFF"
violetColor = "#B39BFF"
grayColor = "#9CACC4"
chartCategoricalColors = ["#3977D5", "#B87812", "#238568", "#8B5CF6", "#D34E69", "#238CA1"]

[theme.dark.sidebar]
backgroundColor = "#0C1423"
secondaryBackgroundColor = "#152034"
textColor = "#EAF0F9"
borderColor = "#30415C"

[server]

maxUploadSize = 16

headless = true

# Disable source-code watching in production.
# Prevents watchdog/inotify exhaustion on Render.
fileWatcherType = "none"

runOnSave = false

enableXsrfProtection = true


# -----------------------------------------------------------------------------
# BROWSER
# -----------------------------------------------------------------------------

[browser]

gatherUsageStats = false


# -----------------------------------------------------------------------------
# CLIENT
# -----------------------------------------------------------------------------

[client]

showErrorDetails = "none"
toolbarMode = "minimal"
