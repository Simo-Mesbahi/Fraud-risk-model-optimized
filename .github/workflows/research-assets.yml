name: Research data assets
on:
  push:
    branches: [feat/recruiter-science-platform]
    paths:
      - configs/research-assets.json
      - scripts/build_research_assets.py
      - scripts/publish_research_assets.py
      - scripts/browser_smoke.py
      - frontend/**
      - .github/workflows/research-assets.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-data-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Simo-Mesbahi/Fraud-risk-model-optimized'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONPATH: .:src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - name: Verify or publish immutable assets
        id: assets
        run: python scripts/publish_research_assets.py
      - name: Diagnose research corpus reproducibility
        if: failure() && steps.assets.outcome == 'failure'
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import pandas as pd
          import pyarrow
          from health_fraud.data.scenarios import materialize_scenario

          root = Path.cwd()
          report = json.loads((root / "artifacts/research/expanded/report.json").read_text())
          target = root / "data/research/expanded"
          if not (target / "claims.parquet").exists():
              materialize_scenario(root / "configs/data.yaml", target, rows=150000, seed=1729)
          path = target / "claims.parquet"
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = report["input_sha256"]
          frame = pd.read_parquet(path)
          recorded = report["dataset"]
          manifest = json.loads((target / "manifest.json").read_text())
          print(json.dumps({
              "expected_sha256": expected,
              "actual_sha256": actual,
              "byte_hash_matches": actual == expected,
              "expected_rows": recorded["accepted_claims"],
              "actual_rows": len(frame),
              "expected_fraud_prevalence": recorded["fraud_prevalence"],
              "actual_fraud_prevalence": float(frame.is_fraud.mean()),
              "expected_config_sha256": recorded["config_sha256"],
              "actual_config_sha256": manifest["config_sha256"],
              "python_pandas": pd.__version__,
              "pyarrow": pyarrow.__version__,
          }, indent=2))
          PY
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Exercise real browser workflows
        run: |
          python -m uvicorn api.app.main:app --host 127.0.0.1 --port 8000 > /tmp/fraud-api.log 2>&1 &
          FRAUD_API_URL=http://127.0.0.1:8000 APP_ENV=production python -m streamlit run frontend/app.py --server.port=8501 --server.headless=true > /tmp/fraud-ui.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:8501/_stcore/health; then break; fi
            sleep 2
          done
          python scripts/browser_smoke.py
      - name: Publish visual review evidence
        run: |
          gh release create "fraud-demo-qa-${GITHUB_SHA:0:12}" reports/browser/*.png reports/browser/result.json --target "$GITHUB_SHA" --title "Synthetic demo browser verification" --notes "Desktop and mobile screenshots from the full browser workflow; synthetic data only." --prerelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-research-preview
          path: |
            reports/browser/
            /tmp/fraud-api.log
            /tmp/fraud-ui.log
          retention-days: 7
