name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONPATH: .:src
  PYTHONDONTWRITEBYTECODE: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  quality-tests:
    name: Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: python -m pip check
      - run: python scripts/fetch_research_assets.py
      - run: ruff check .
      - run: mypy
      - name: Unit, integration, UI and numerical coverage
        run: |
          python -m pytest tests -q --cov=health_fraud --cov=api.app --cov=frontend.api_client --cov=frontend.utils --cov=frontend.research --cov=frontend.views.data_science --cov-report=term-missing
          python -m pytest api/tests -q --cov=health_fraud --cov=api.app --cov=frontend.api_client --cov=frontend.utils --cov=frontend.research --cov=frontend.views.data_science --cov-append --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=75
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
  docker-build:
    name: Containers & Browser
    runs-on: ubuntu-latest
    needs: quality-tests
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/dev.lock
      - run: python -m pip install --require-hashes -r requirements/dev.lock
      - run: python -m playwright install --with-deps chromium
      - run: docker compose config --quiet
      - run: docker compose build --pull
      - run: docker compose up -d --wait --wait-timeout 180
      - name: Validate API scoring and explanation inside the container
        run: |
          docker compose exec -T fraud-api python - <<'PY'
          import json, urllib.request
          info = json.load(urllib.request.urlopen('http://127.0.0.1:8000/model-info'))
          assert info['model_version'] == '1.0.0' and info['feature_count'] == 57
          PY
          test "$(docker compose exec -T fraud-api id -u)" != 0
          test "$(docker compose exec -T fraud-frontend id -u)" != 0
      - name: Browser happy paths, downloads and mobile layout
        run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-verification
          path: reports/browser/
          retention-days: 14
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=150
      - name: Stop stack
        if: always()
        run: docker compose down --remove-orphans
